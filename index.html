<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration System</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: linear-gradient(135deg, #667eea, #764ba2);
  padding: 20px;
}

/* TITLE */
h1 {
  text-align: center;
  color: white;
  margin-bottom: 20px;
}

/* ================= TABLE CARD ================= */
.table-container {
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  overflow-x: auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 600px;
}

th {
  background: #4f46e5;
  color: white;
  padding: 12px;
}

td {
  padding: 12px;
  text-align: center;
  border-bottom: 1px solid #eee;
}

/* ================= FORM CARD ================= */
.form-container {
  max-width: 500px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
  text-align: center;
  margin-bottom: 15px;
  color: #333;
}

label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
  color: #333;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 8px;
  outline: none;
}

input:focus, select:focus, textarea:focus {
  border-color: #4f46e5;
  box-shadow: 0 0 5px rgba(79,70,229,0.3);
}

/* GENDER */
.gender {
  display: flex;
  gap: 10px;
  margin-top: 10px;
  flex-wrap: wrap;
}

/* BUTTONS */
.buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.submit {
  background: #22c55e;
  color: white;
}

.reset {
  background: #ef4444;
  color: white;
}

/* MESSAGE */
.msg {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .buttons {
    flex-direction: column;
  }

  .form-container {
    width: 95%;
  }
}
</style>
</head>

<body>

<h1>Student Management System</h1>

<!-- ================= TABLE ================= -->
<div class="table-container">
  <table>
    <tr>
      <th>Name</th>
      <th>Course</th>
      <th>Mobile</th>
      <th>Email</th>
    </tr>

    <tr>
      <td>John</td>
      <td>React JS</td>
      <td>9876543210</td>
      <td>john@gmail.com</td>
    </tr>

    <tr>
      <td>Sarah</td>
      <td>HTML</td>
      <td>9123456780</td>
      <td>sarah@gmail.com</td>
    </tr>

    <tr>
      <td>Arjun</td>
      <td>JavaScript</td>
      <td>9988776655</td>
      <td>arjun@gmail.com</td>
    </tr>

    <tr>
      <td>Priya</td>
      <td>CSS</td>
      <td>9012345678</td>
      <td>priya@gmail.com</td>
    </tr>

  </table>
</div>

<!-- ================= FORM ================= -->
<div class="form-container">

  <h2>Student Registration Form</h2>

  <label>Full Name</label>
  <input type="text" id="name" placeholder="Enter Full Name">

  <label>Email</label>
  <input type="email" id="email" placeholder="Enter Email">

  <label>Phone</label>
  <input type="tel" id="phone" placeholder="Enter Phone Number">

  <label>Gender</label>
  <div class="gender">
    <label><input type="radio" name="gender" value="Male"> Male</label>
    <label><input type="radio" name="gender" value="Female"> Female</label>
    <label><input type="radio" name="gender" value="Other"> Other</label>
  </div>

  <label>Course</label>
  <select id="course">
    <option value="">Select Course</option>
    <option>HTML</option>
    <option>CSS</option>
    <option>JavaScript</option>
    <option>React JS</option>
  </select>

  <label>Address</label>
  <textarea id="address" rows="3" placeholder="Enter Address"></textarea>

  <div class="buttons">
    <button class="submit" onclick="submitForm()">Submit</button>
    <button class="reset" onclick="resetForm()">Reset</button>
  </div>

  <div class="msg" id="msg"></div>

</div>

<!-- ================= JS ================= -->
<script>
function submitForm() {

  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let course = document.getElementById("course").value;
  let address = document.getElementById("address").value.trim();
  let gender = document.querySelector('input[name="gender"]:checked');

  if (name === "") return showMsg("⚠ Please enter full name", "red");
  if (email === "") return showMsg("⚠ Please enter email", "red");
  if (phone === "") return showMsg("⚠ Please enter phone number", "red");
  if (!gender) return showMsg("⚠ Please select gender", "red");
  if (course === "") return showMsg("⚠ Please select course", "red");
  if (address === "") return showMsg("⚠ Please enter address", "red");

  showMsg("✅ Registration Successful!", "green");

  console.log({
    name,
    email,
    phone,
    gender: gender.value,
    course,
    address
  });

  setTimeout(resetForm, 1500);
}

function resetForm() {
  document.getElementById("name").value = "";
  document.getElementById("email").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("course").value = "";
  document.getElementById("address").value = "";

  document.querySelectorAll('input[name="gender"]').forEach(e => e.checked = false);

  showMsg("", "");
}

function showMsg(text, color) {
  let msg = document.getElementById("msg");
  msg.innerText = text;
  msg.style.color = color;
}
</script>

</body>
</html>
